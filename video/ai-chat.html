<!doctype html>
<!-- ai-chat.html - a stand-in for the take S3 of the promotional video: a plain AI chat, of no company, that
     replays the real prompt and the real answer of night-drive/. capture.mjs (take s3-ai) plays it.
     A recording of your own AI chat replaces it: see STORYBOARD.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI chat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #171615; color: #ede4cc; font: 26px/1.5 Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  header { flex: none; display: flex; align-items: baseline; gap: 18px; padding: 18px 40px; border-bottom: 1px solid #34302b; }
  header b { font-size: 26px; letter-spacing: 0.12em; }
  header span { color: #a89f8b; font-size: 18px; }
  main { flex: 1; overflow: hidden; padding: 28px 0 12px; }
  .thread { width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
  .user { align-self: flex-end; max-width: 1000px; background: #2d2925; border-radius: 22px; padding: 16px 24px; }
  .user .text { white-space: pre-wrap; max-height: 5.9em; overflow: hidden; font-size: 23px;
    -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .user .size, .composer .size { color: #a89f8b; font-size: 16px; margin-top: 6px; }
  .answer { align-self: stretch; }
  .answer .who { color: #f6b31b; font-weight: 700; font-size: 18px; letter-spacing: 0.1em; margin-bottom: 8px; }
  .answer p { margin: 0 0 14px; white-space: pre-wrap; }
  .answer .code { margin: 0 0 16px; border: 1px solid #34302b; border-radius: 12px; overflow: hidden; background: #0f0e0d; }
  .answer .code i { display: block; font: normal 15px/1 Consolas, monospace; color: #a89f8b; padding: 10px 18px; background: #24211e; }
  .answer pre { margin: 0; padding: 14px 18px; font: 20px/1.45 Consolas, monospace; color: #cdf2ff; white-space: pre; overflow: hidden; }
  .dots { color: #a89f8b; letter-spacing: 0.3em; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .actions { display: flex; gap: 12px; margin-top: 4px; }
  button { font: 700 17px/1 Arial, sans-serif; letter-spacing: 0.08em; color: #ede4cc; background: #2d2925; border: 1px solid #4a443d;
    border-radius: 10px; padding: 12px 18px; cursor: pointer; }
  button:hover { background: #3a352f; }
  button.done { color: #100f0e; background: #7be08a; border-color: #7be08a; }
  .composer { flex: none; width: 1400px; margin: 0 auto 26px; display: flex; gap: 14px; align-items: flex-end; background: #24211e;
    border: 1px solid #4a443d; border-radius: 22px; padding: 14px 16px 14px 24px; }
  .composer .field { flex: 1; min-height: 34px; }
  .composer .text { white-space: pre-wrap; max-height: 4.5em; overflow: hidden; font-size: 23px; outline: none; }
  .composer .text:empty::before { content: 'Ask anything'; color: #7d7567; }
  #send { background: #f6b31b; border-color: #f6b31b; color: #100f0e; padding: 13px 22px; }
</style>
</head>
<body>
<header><b>AI CHAT</b><span>a replay of a real answer: the prompt of FM-1 Studio, and the first answer of the AI</span></header>
<main id="scroll"><div class="thread" id="thread"></div></main>
<div class="composer">
  <div class="field"><div class="text" id="input" contenteditable="plaintext-only"></div><div class="size" id="input-size" hidden></div></div>
  <button id="send">SEND</button>
</div>
<script>
const $ = (id) => document.getElementById(id);
const make = (tag, className, text) => Object.assign(document.createElement(tag), { className: className ?? '', textContent: text ?? '' });
const count = (text) => `${text.length.toLocaleString('en-US')} characters`;
let prompt = '';

// A paste puts the prompt in the field: its first lines, and its size.
document.addEventListener('paste', (event) => {
  event.preventDefault();
  prompt = event.clipboardData.getData('text/plain');
  $('input').textContent = prompt.slice(0, 600);
  $('input-size').textContent = count(prompt);
  $('input-size').hidden = false;
});

$('send').onclick = () => {
  if (!prompt) return;
  const bubble = make('div', 'user');
  bubble.append(make('div', 'text', prompt.slice(0, 900)), make('div', 'size', count(prompt)));
  $('thread').append(bubble);
  $('input').textContent = '';
  $('input-size').hidden = true;
  const answer = make('div', 'answer');
  answer.id = 'answer';
  answer.append(make('div', 'who', 'AI'), make('div', 'dots', '•••'));
  $('thread').append(answer);
};

// Writes `text` (Markdown with code blocks) as the answer, `perSecond` characters a second, as a chat does.
// The view follows the end of the answer. COPY comes when the answer is complete.
window.chat = {
  done: false,
  copied: false,
  async answer(text, perSecond) {
    const answer = $('answer');
    answer.querySelector('.dots').remove();
    const pieces = [];  // the text and the code blocks of the answer, in sequence
    let piece = { code: false, lines: [] };
    for (const line of text.split(/\r?\n/)) {
      if (line.startsWith('```')) {
        pieces.push(piece);
        piece = { code: !piece.code, language: line.slice(3).trim(), lines: [] };
      } else {
        piece.lines.push(line);
      }
    }
    pieces.push(piece);
    const start = performance.now();
    let written = 0;
    for (const piece of pieces) {
      // Code as it is; of the other text, the marks of Markdown go away
      const all = piece.lines.join('\n');
      const body = piece.code ? all + '\n' : all.replace(/^\n+|\n+$/g, '').replace(/\*\*/g, '').replace(/^#+ /gm, '');
      if (!body.trim()) continue;
      let target;
      if (piece.code) {
        const box = make('div', 'code');
        target = make('pre');
        box.append(make('i', '', piece.language || 'code'), target);
        answer.append(box);
      } else {
        target = make('p');
        answer.append(target);
      }
      const node = document.createTextNode('');
      target.append(node);
      for (let at = 0; at < body.length;) {
        await new Promise(requestAnimationFrame);
        const want = Math.min(body.length, Math.floor((performance.now() - start) / 1000 * perSecond) - written + at);
        if (want > at) {
          node.appendData(body.slice(at, want));
          written += want - at;
          at = want;
          $('scroll').scrollTop = $('scroll').scrollHeight;
        }
      }
    }
    const actions = make('div', 'actions');
    const copy = make('button', '', 'COPY');
    copy.id = 'copy';
    copy.onclick = () => { copy.textContent = '✓ COPIED'; copy.classList.add('done'); this.copied = true; };
    actions.append(copy);
    answer.append(actions);
    $('scroll').scrollTop = $('scroll').scrollHeight;
    this.done = true;
  },
};
</script>
</body>
</html>
