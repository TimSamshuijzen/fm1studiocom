<style>
  /* The error page of FM-1 Studio. It has the colours and the parts of index.html, and no script.
     It can show at each address of the site, thus all its links start at the root. */
  :root {
    color-scheme: dark;
    --room: #0c0b0a; --mahogany: #5a1d10;
    --panel: #171615; --panel-high: #201e1c; --panel-low: #100f0e;
    --silk: #ede4cc; --silk-dim: #a89f8b;
    --stripe-1: #f6b31b; --stripe-2: #f2801f; --stripe-3: #e2492a; --stripe-4: #b8282d;
    --oled-bg: #020304; --oled: #cdf2ff; --oled-mid: #6fb9d2;
    --focus: #ffdf76;
    --font-panel: "Eurostile", "Microgramma D Extended", "Michroma", "Bank Gothic", "Arial Narrow",
      "Helvetica Neue", Arial, sans-serif;
    --font-label: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Consolas, "DejaVu Sans Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; min-height: 100vh; padding: 16px;
    background: radial-gradient(1200px 700px at 50% 40%, #2a2420 0%, #141210 55%, var(--room) 100%), var(--room);
    color: var(--silk); font-family: var(--font-label); -webkit-font-smoothing: antialiased;
  }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .device {
    position: relative; width: 100%; max-width: 560px;
    border-radius: 18px; box-shadow: 0 30px 60px #000c, 0 10px 20px #0009;
  }
  .cheek {
    position: absolute; top: 0; bottom: 0; width: 24px;
    background:
      linear-gradient(90deg, #1a0503b8 0%, #0000 20%, #ffd9c212 40%, #ffe6d62e 50%, #ffd9c212 58%, #0000 70%, #1a0503cc 100%),
      repeating-linear-gradient(91deg, #0000 0 3px, #2a0a0555 3px 4px, #0000 4px 9px, #8a3a2233 9px 10px),
      var(--mahogany);
    box-shadow: inset 0 2px 0 #ffffff2e, inset 0 -3px 0 #0009;
  }
  .cheek.left { left: 0; border-radius: 18px 4px 4px 18px; }
  .cheek.right { right: 0; border-radius: 4px 18px 18px 4px; }
  .case {
    margin: 0 24px; padding: 18px 18px 22px; display: grid; gap: 16px;
    background:
      linear-gradient(180deg, #ffffff0a, #0000 3px),
      repeating-linear-gradient(90deg, #ffffff03 0 1px, #0000 1px 3px),
      linear-gradient(180deg, var(--panel-high), var(--panel) 40%, var(--panel-low));
    border-top: 2px solid #3a3733; border-bottom: 2px solid #050505;
  }

  .masthead { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .logo {
    font-family: var(--font-panel); font-size: 27px; font-weight: 900; font-style: italic; line-height: 1;
    white-space: nowrap; padding-right: 4px; color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(180deg, var(--stripe-1) 0 36%, var(--stripe-2) 36% 56%, var(--stripe-3) 56% 76%, var(--stripe-4) 76%);
    filter: drop-shadow(0 2px 2px #000a);
  }
  .stripes { flex: 1 1 0; min-width: 0; display: grid; gap: 3px; }
  .stripes i { display: block; height: 4px; border-radius: 1px; }
  .stripes i:nth-child(1) { background: var(--stripe-1); }
  .stripes i:nth-child(2) { background: var(--stripe-2); }
  .stripes i:nth-child(3) { background: var(--stripe-3); }
  .stripes i:nth-child(4) { background: var(--stripe-4); }

  .oled {  /* the display with the message */
    position: relative; overflow: hidden; margin: 0 4px; padding: 16px 18px; display: grid; gap: 8px;
    background: var(--oled-bg); border-radius: 4px;
    box-shadow: 0 0 0 1px #000, 0 0 0 3px #2b2926, 0 0 0 4px #0b0a09, inset 0 0 18px #0d2a3466;
    font-family: var(--font-mono); color: var(--oled);
  }
  .oled::after {  /* the light on the glass */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(160deg, #ffffff12 0%, #ffffff04 38%, #0000 40%);
  }
  .oled h1 { margin: 0; font-size: 20px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: var(--stripe-1); }
  .oled p { margin: 0; font-size: 13px; line-height: 19px; color: var(--oled-mid); }

  .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 0 4px; }
  .lamp {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-panel); font-size: 10px; font-weight: 700; letter-spacing: 0.18em; color: var(--silk-dim);
  }
  .lamp i {  /* red: there is an error */
    width: 9px; height: 9px; border-radius: 50%; background: #ff4a30;
    box-shadow: 0 0 0 1px #000, 0 0 8px #ff2a1a; animation: lit 0.9s ease-in-out infinite alternate;
  }
  @keyframes lit { from { filter: brightness(0.6); } to { filter: brightness(1.15); } }
  @media (prefers-reduced-motion: reduce) { .lamp i { animation: none; } }
  .push {  /* the orange button that opens FM-1 Studio */
    display: grid; place-items: center; height: 28px; padding: 0 14px; border-radius: 4px;
    background: linear-gradient(#f79a3e, var(--stripe-2) 45%, #cc6410);
    box-shadow: 0 0 0 1px #000, 0 2px 0 #000, inset 0 1px 0 #ffffff59;
    font-family: var(--font-panel); font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    color: #241000; text-decoration: none; white-space: nowrap;
  }
  .push:active { transform: translateY(1px); box-shadow: 0 0 0 1px #000, 0 1px 0 #000, inset 0 1px 0 #ffffff59; }
</style>
</head>
<body>

<main class="device">
  <div class="cheek left"></div>
  <div class="cheek right"></div>
  <div class="case">
    <header class="masthead">
      <div class="logo">FM-1 STUDIO</div>
      <div class="stripes"><i></i><i></i><i></i><i></i></div>
    </header>
    <div class="oled">
      <h1>Page not available</h1>
      <p>FM-1 Studio cannot show this page. Make sure that the address is correct, or open FM-1 Studio.</p>
    </div>
    <div class="controls">
      <span class="lamp"><i></i>ERROR</span>
      <a class="push" href="/">OPEN FM-1 STUDIO</a>
    </div>
  </div>
</main>

</body>
</html>
